<div class="form-container" id="orcamentoRoot">
  <h2 class="title-color" id="orcTitulo">Criar Orçamento</h2>

  <!-- ================= CLIENTE ================= -->
  <fieldset>
    <legend>Dados do Cliente</legend>
    <div class="row">
      <div class="col-md-6">
        <div class="coolinput">
          <label for="clienteNome" class="text">Nome do Cliente:</label>
          <div class="input-with-clear">
            <input type="text" id="clienteNome" class="input" placeholder="Pesquisar cliente..." autocomplete="off" readonly />
            <button type="button" class="input-clear-btn d-none" id="clearCliente"><i class="bi bi-x"></i></button>
          </div>
          <input type="hidden" id="clienteId" />
        </div>
      </div>
      <div class="col-md-6 d-flex align-items-center">
        <div id="clienteDetalhes" class="text-muted" style="font-size: 0.9rem;"></div>
      </div>
    </div>
  </fieldset>

  <br />

  <!-- ================= GRELHA ================= -->
  <fieldset>
    <legend>Linhas do Orçamento</legend>

    <!-- Abas das opções: Opção 1, Opção 2, ... -->
    <div class="orc-tabs" id="orcTabs"></div>

    <div class="orc-grid-wrap" id="orcGridWrap" tabindex="0">
      <table class="orc-grid" id="orcGrid">
        <thead>
          <tr>
            <th class="c-n">#</th>
            <th class="c-tipo">Tipo</th>
            <th class="c-prod">Produto</th>
            <th class="c-num">Qtd</th>
            <th class="c-num">Comp. (m)</th>
            <th class="c-num">Larg. (m)</th>
            <th class="c-num">m²</th>
            <th class="c-num">Preço/m²</th>
            <th class="c-num">Desc. (%)</th>
            <th class="c-num">Subtotal</th>
            <th class="c-num">Total</th>
            <th class="c-num">Total Orçamento</th>
          </tr>
        </thead>
        <tbody id="orcGridBody"></tbody>
        <tfoot>
          <tr>
            <td colspan="11" class="orc-foot-label" id="orcFootLabel">Total do Orçamento</td>
            <td class="orc-foot-total" id="orcTotalGeral">0.00 €</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="d-flex gap-3 flex-wrap">
      <button type="button" id="btnMaisLinhas" class="btn-form" style="background-color:#6c757d;">
        <i class="bi bi-plus-square me-2"></i>Adicionar 5 linhas
      </button>
    </div>
  </fieldset>

  <br />

  <div class="form-actions justify-content-end">
    <button type="button" id="btnCancelarEdicao" class="btn-form d-none" style="background-color:#6c757d;">
      <i class="bi bi-x-circle me-2"></i> Cancelar
    </button>
    <button type="button" id="btnLimparOrcamento" class="btn-form" style="background-color:#dc3545;">
      <i class="bi bi-trash me-2"></i> Limpar Tudo
    </button>
    <button type="button" id="btnGuardarOrcamento" class="btn-form">
      <i class="bi bi-save me-2"></i> <span id="btnGuardarTxt">Guardar Orçamento</span>
    </button>
  </div>
</div>a
