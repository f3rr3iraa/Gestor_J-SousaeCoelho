<div class="container-fluid">
  <h4 class="mb-3"><i class="bi bi-sticky me-2"></i>Notas / Recados</h4>

  <div class="notas-calendar-wrapper">
    <div class="notas-nav-row">
      <button id="notasPrevMonth" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-chevron-left me-1"></i>Anterior
      </button>

      <span id="notasMesLabel" class="fw-semibold notas-mes-label"></span>

      <div class="d-flex align-items-center gap-2">
        <button id="notasHojeBtn" class="btn btn-outline-primary btn-sm">Hoje</button>
        <button id="notasNextMonth" class="btn btn-outline-secondary btn-sm">
          Seguinte<i class="bi bi-chevron-right ms-1"></i>
        </button>
      </div>
    </div>

    <table class="table table-bordered text-center align-middle notas-calendar-table">
      <thead>
        <tr>
          <th>Seg</th>
          <th>Ter</th>
          <th>Qua</th>
          <th>Qui</th>
          <th>Sex</th>
          <th>Sáb</th>
          <th>Dom</th>
        </tr>
      </thead>
      <tbody id="notasCalendarBody">
        <!-- gerado via JS -->
      </tbody>
    </table>
  </div>

  <div class="d-flex gap-3 small text-muted flex-wrap notas-calendar-wrapper mt-2">
    <span><span class="notas-legend-dot bg-warning"></span> Com notas por concluir</span>
    <span><span class="notas-legend-dot bg-success"></span> Todas concluídas</span>
  </div>
</div>

<!-- Offcanvas do dia -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="notasDayOffcanvas" style="width: 420px;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="notasDayTitle">Notas do dia</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">

    <!-- Nova nota -->
    <form id="notasNovaForm" class="mb-3">
      <label class="form-label small mb-1">Nova nota / recado</label>
      <textarea id="notasNovoTexto" class="form-control mb-2" rows="2" placeholder="Escreve o recado..." required></textarea>
      <button type="submit" class="btn btn-sm w-100 btn-notas-add">
        <i class="bi bi-plus-lg me-1"></i>Adicionar nota
      </button>
    </form>

    <hr>

    <div id="notasDayList" class="flex-grow-1" style="overflow-y:auto;">
      <!-- gerado via JS -->
    </div>

  </div>
</div>
